[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-voice-assistant"
version = "0.1.0"
description = "Local-first, voice-operated desktop assistant for macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Local Voice Assistant contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "structlog>=24.4,<26",
  "typesafe-sdk>=0.1,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
audio = [
  "numpy>=2,<3",
  "sounddevice>=0.5,<1",
]
browser = ["playwright>=1.51,<2"]
app = [
  "numpy>=2,<3",
  "py2app>=0.28.8,<1; sys_platform == 'darwin'",
  "pyobjc-framework-AVFoundation>=10.3,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3,<13; sys_platform == 'darwin'",
  "rumps>=0.4,<1; sys_platform == 'darwin'",
  "sounddevice>=0.5,<1",
]
dev = [
  "mypy>=1.14,<2",
  "numpy>=2,<3",
  "playwright>=1.51,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.9,<1",
  "sounddevice>=0.5,<1",
]

[project.scripts]
local-assistant = "local_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_assistant"]

# Python 3.12+ deliberately ignores .pth files carrying macOS' UF_HIDDEN flag.
# Include package files in editable wheels as well, so imports never depend only
# on Hatchling's editable-path .pth file.
[tool.hatch.build.targets.wheel.force-include]
"src/local_assistant" = "local_assistant"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires a locally installed external component",
  "e2e: exercises multiple real components and may have visible side effects",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["local_assistant"]
warn_unused_ignores = true
exclude = "^(work|outputs)/"
